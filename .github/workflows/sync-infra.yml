name: Sync swaphaven-infra

# After every push to main, point swaphaven-infra's backend/ submodule at this SHA.
# Requires repo secret INFRA_SYNC_TOKEN (PAT with Contents: write on barterinfo/swaphaven-infra).
# If the secret is missing, the 15-minute cron in swaphaven-infra still picks up origin/main.
on:
  push:
    branches: [main]

concurrency:
  group: sync-infra
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check INFRA_SYNC_TOKEN
        id: token
        env:
          INFRA_SYNC_TOKEN: ${{ secrets.INFRA_SYNC_TOKEN }}
        run: |
          if [ -z "$INFRA_SYNC_TOKEN" ]; then
            echo "INFRA_SYNC_TOKEN is not set."
            echo "swaphaven-infra will catch origin/main on its 15-minute sync cron."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout infra
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: barterinfo/swaphaven-infra
          token: ${{ secrets.INFRA_SYNC_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Point backend submodule at this commit
        if: steps.token.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/sync-backend.sh
          ./scripts/sync-backend.sh --push "${{ github.sha }}"
